<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamia Casa</title>
    <style>
        .apartment-card {
            position: relative;
            width: 300px;
            height: 200px;
            overflow: hidden;
        }
        .apartment-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .banner {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(255, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            font-weight: bold;
            border-radius: 5px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="apartment-card">
        <img class="apartment-image" src="/path/to/apartment-image.jpg" alt="Posto auto esterno – Ascona">
        <div class="banner">Affittato</div>
    </div>
    <script>
        // Additional scripts
    </script>
</body>
</html>
